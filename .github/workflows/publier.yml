name: Publier Course Coach

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dependances
        run: npm install
        working-directory: course-coach

      - name: Adapter le projet a GitHub Pages
        run: |
          sed -i "s/<BrowserRouter>/<BrowserRouter basename={import.meta.env.BASE_URL}>/" src/main.tsx
          sed -i "s|register('/sw.js')|register(import.meta.env.BASE_URL + 'sw.js')|" src/main.tsx
        working-directory: course-coach

      - name: Construire le site
        run: npm run build -- --base=/Course-coach-/
        working-directory: course-coach

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Preparer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: course-coach/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4

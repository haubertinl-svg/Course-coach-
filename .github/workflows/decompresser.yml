name: Installer Course Coach

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Decompresser le projet
        run: |
          unzip -q course-coach.zip -d /tmp/course-coach
          cp -R /tmp/course-coach/course-coach/. .
          rm course-coach.zip

      - name: Enregistrer les fichiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Installer les fichiers de Course Coach"
          git push
